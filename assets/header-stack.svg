acity=".03"/></linearGradient><linearGradient id="rim" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".38"/><stop offset=".5" stop-color="#fff" stop-opacity=".10"/><stop offset="1" stop-color="#db94ed" stop-opacity=".30"/></linearGradient><linearGradient id="fade" x1="0" x2="1"><stop offset="0" stop-color="#db94ed" stop-opacity="0"/><stop offset=".5" stop-color="#db94ed" stop-opacity=".9"/><stop offset="1" stop-color="#db94ed" stop-opacity="0"/></linearGradient><linearGradient id="scanline" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#db94ed" stop-opacity="0"/><stop offset=".5" stop-color="#db94ed" stop-opacity=".07"/><stop offset="1" stop-color="#db94ed" stop-opacity="0"/></linearGradient><filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3"/></filter><filter id="bloom" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="2.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><circle cx="30" cy="40" r="6" fill="#db94ed" class="pulse" filter="url(#bloom)"/><text x="52" y="48" class="t" font-size="22" fill="#f3ecf8" text-anchor="start" letter-spacing="4">TOOLS I REACH FOR</text><text x="52" y="76" class="t" font-size="14" fill="#7d7088" text-anchor="start">what these projects are made of</text><circle cx="368.4" cy="40.0" r="1.6" fill="#db94ed" opacity="0.26"/><circle cx="382.4" cy="40.0" r="1.6" fill="#db94ed" opacity="0.65"/><circle cx="396.4" cy="40.0" r="1.6" fill="#db94ed" opacity="0.36"/><circle cx="410.4" cy="40.0" r="1.6" fill="#db94ed" opacity="0.28"/><circle cx="424.4" cy="40.0" r="1.6" fill="#db94ed" opacity="0.69"/><circle cx="438.4" cy="40.0" r="1.6" fill="#db94ed" opacity="0.33"/><circle cx="452.4" cy="40.0" r="1.6" fill="#db94ed" opacity="0.41"/><circle cx="466.4" cy="40.0" r="1.6" fill="#db94ed" opacity="0.80"/><circle cx="480.4" cy="40.0" r="1.6" fill="#db94ed" opacity="0.45"/><circle cx="494.4"