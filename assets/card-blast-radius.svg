<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 356" width="600" height="356" role="img"><title>Blast Radius: Resolves your full npm or Python tree in the browser, scores every package&#x27;s risk, and shows which choice pulled it in.</title><defs><style>.t{font-family:'DM Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace}.tw{animation:tw 4s ease-in-out infinite}.spin{transform-box:view-box;animation:spin linear infinite}.pulse{animation:pulse 4s ease-in-out infinite}.blink{animation:blink 1.2s steps(1) infinite}.sweep{transform-box:view-box;animation:spin 6s linear infinite}.travel{animation:travel 7s cubic-bezier(.45,0,.55,1) infinite}.orbit{animation:orbit linear infinite}.shine{animation:shine 9s ease-in-out infinite}.scan{animation:scan 9s linear infinite}@keyframes tw{0%,100%{opacity:.12}50%{opacity:.9}}@keyframes spin{to{transform:rotate(360deg)}}@keyframes pulse{0%,100%{opacity:.45}50%{opacity:1}}@keyframes blink{0%{opacity:1}50%{opacity:0}}@keyframes travel{0%{transform:translateX(0);opacity:0}6%{opacity:1}94%{opacity:1}100%{transform:translateX(var(--dx));opacity:0}}@keyframes orbit{to{stroke-dashoffset:-360}}@keyframes shine{0%{transform:translateX(0)}45%,100%{transform:translateX(var(--sw))}}@keyframes scan{0%{transform:translateY(-80px)}100%{transform:translateY(var(--sh,460px))}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><radialGradient id="glow"><stop offset="0" stop-color="#ee15ee" stop-opacity=".38"/><stop offset=".45" stop-color="#db94ed" stop-opacity=".13"/><stop offset="1" stop-color="#0a070d" stop-opacity="0"/></radialGradient><radialGradient id="neb1" cx=".15" cy="0" r=".8"><stop offset="0" stop-color="#ee15ee" stop-opacity=".18"/><stop offset="1" stop-color="#0a070d" stop-opacity="0"/></radialGradient><radialGradient id="neb2" cx=".92" cy="1" r=".7"><stop offset="0" stop-color="#db94ed" stop-opacity=".13"/><stop offset="1" stop-color="#0a070d" stop-opacity="0"/></radialGradient><linearGradient id="glass" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".10"/><stop offset=".18" stop-color="#fff" stop-opacity=".045"/><stop offset="1" stop-color="#fff" stop-opacity=".03"/></linearGradient><linearGradient id="rim" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".38"/><stop offset=".5" stop-color="#fff" stop-opacity=".10"/><stop offset="1" stop-color="#db94ed" stop-opacity=".30"/></linearGradient><linearGradient id="fade" x1="0" x2="1"><stop offset="0" stop-color="#db94ed" stop-opacity="0"/><stop offset=".5" stop-color="#db94ed" stop-opacity=".9"/><stop offset="1" stop-color="#db94ed" stop-opacity="0"/></linearGradient><linearGradient id="band" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient><linearGradient id="scanline" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#db94ed" stop-opacity="0"/><stop offset=".5" stop-color="#db94ed" stop-opacity=".08"/><stop offset="1" stop-color="#db94ed" stop-opacity="0"/></linearGradient><filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3"/></filter><filter id="bloom" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="2.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><g transform="translate(8 0)"><rect width="592.0" height="356" rx="18" fill="#0a070d"/><rect width="592.0" height="356" rx="18" fill="url(#neb1)"/><rect width="592.0" height="356" rx="18" fill="url(#neb2)"/><path d="M390.2 87.1h0M418.7 61.5h0M345.5 17.8h0M562.6 202.8h0M579.5 162.3h0M332.0 21.2h0M179.3 85.6h0M157.4 182.9h0M501.0 220.8h0M87.9 53.9h0M124.1 48.3h0M116.4 253.2h0M485.3 328.7h0M417.4 267.7h0M176.7 304.4h0M402.7 26.2h0M433.5 119.0h0M233.3 287.2h0M106.6 195.9h0M259.8 208.6h0M95.0 296.8h0M427.0 33.7h0M368.8 226.6h0M392.0 160.7h0M83.8 168.6h