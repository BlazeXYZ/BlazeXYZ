<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 356" width="600" height="356" role="img"><title>authtrail: Finds the one successful login hiding in thousands of failures, then rebuilds what the attacker did next as a timeline.</title><defs><style>.t{font-family:'DM Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace}.tw{animation:tw 4s ease-in-out infinite}.spin{transform-box:view-box;animation:spin linear infinite}.pulse{animation:pulse 4s ease-in-out infinite}.blink{animation:blink 1.2s steps(1) infinite}.sweep{transform-box:view-box;animation:spin 6s linear infinite}.travel{animation:travel 7s cubic-bezier(.45,0,.55,1) infinite}.orbit{animation:orbit linear infinite}.shine{animation:shine 9s ease-in-out infinite}.scan{animation:scan 9s linear infinite}@keyframes tw{0%,100%{opacity:.12}50%{opacity:.9}}@keyframes spin{to{transform:rotate(360deg)}}@keyframes pulse{0%,100%{opacity:.45}50%{opacity:1}}@keyframes blink{0%{opacity:1}50%{opacity:0}}@keyframes travel{0%{transform:translateX(0);opacity:0}6%{opacity:1}94%{opacity:1}100%{transform:translateX(var(--dx));opacity:0}}@keyframes orbit{to{stroke-dashoffset:-360}}@keyframes shine{0%{transform:translateX(0)}45%,100%{transform:translateX(var(--sw))}}@keyframes scan{0%{transform:translateY(-80px)}100%{transform:translateY(var(--sh,460px))}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><radialGradient id="glow"><stop offset="0" stop-color="#ee15ee" stop-opacity=".38"/><stop offset=".45" stop-color="#db94ed" stop-opacity=".13"/><stop offset="1" stop-color="#0a070d" stop-opacity="0"/></radialGradient><radialGradient id="neb1" cx=".15" cy="0" r=".8"><stop offset="0" stop-color="#ee15ee" stop-opacity=".18"/><stop offset="1" stop-color="#0a070d" stop-opacity="0"/></radialGradient><radialGradient id="neb2" cx=".92" cy="1" r=".7"><stop offset="0" stop-color="#db94ed" stop-opacity=".13"/><stop offset="1" stop-color="#0a070d" stop-opacity="0"/></radialGradient><linearGradient id=